seed: 42  # 全局随机种子，用于保证实验可复现性

# Models are instantiated using skrl's model instantiator utility
# https://skrl.readthedocs.io/en/latest/api/utils/model_instantiators.html
models:
  separate: False  # 是否为策略网络(policy)和价值网络(value)使用独立的底层特征提取器（False表示两者网络结构独立，不共享权重）
  policy:  # 策略网络(Actor)配置，用于输出动作
    class: GaussianMixin  # 使用高斯混合模型分布，适合连续动作空间
    clip_actions: False  # 是否在网络输出阶段对动作进行裁剪（在环境层面通常也会有裁剪，所以这里一般填False）
    clip_log_std: True  # 是否限制对数标准差的范围，防止方差过大或过小
    min_log_std: -2.0  # 对数标准差的下限，避免探索标准差过早坍缩到接近确定性策略
    max_log_std: 0.5  # 对数标准差的上限，限制策略后期继续输出过大的动作噪声
    initial_log_std: -0.5  # 初始标准差约0.61，给低维IK任务保留足够探索
    network:  # 策略网络的结构
      - name: net
        input: OBSERVATIONS  # 网络的输入数据：状态观测值
        layers: [64, 64]  # 隐藏层结构，两层全连接层(MLP)，每层64个神经元
        activations: elu  # 激活函数类型：elu (Exponential Linear Unit)
    output: ACTIONS  # 网络的输出数据：动作
  value:  # 价值网络(Critic)配置，用于预估当前状态的未来总收益
    class: DeterministicMixin  # 确定性混合模型，因为价值网络只输出一个确定的评分标量
    clip_actions: False
    network:  # 价值网络的结构
      - name: net
        input: OBSERVATIONS  # 网络的输入数据：状态观测值
        layers: [64, 64]  # 隐藏层结构，两层全连接层，每层64个神经元
        activations: elu  # 激活函数类型：elu
    output: ONE  # 网络的输出数据：一个标量值（状态的预测价值 V）


# Rollout memory
# https://skrl.readthedocs.io/en/latest/api/memories/random.html
memory:
  class: RandomMemory  # 经验回放池的类型，用于PPO等同策略(On-Policy)算法
  memory_size: -1  # 经验池大小，设为-1会自动设置为与下文 agent.rollouts 相等的值


# PPO agent configuration (field names are from PPO_DEFAULT_CONFIG)
# https://skrl.readthedocs.io/en/latest/api/agents/ppo.html
agent:
  class: PPO  # 使用的强化学习算法：PPO (Proximal Policy Optimization)
  rollouts: 64  # 每次策略更新前，在环境中收集的步数(steps/transitions)
  learning_epochs: 5  # 每次收集完数据后，对这些数据进行几轮网络更新（复用数据的次数）
  mini_batches: 16  # 在每轮更新中，将收集到的数据分成几个小批次(mini-batches)来进行梯度下降
  discount_factor: 0.99  # 奖励折扣因子(gamma)，0.99表示重视长期回报
  lambda: 0.95  # GAE (Generalized Advantage Estimation)的平滑参数，平衡偏差和方差
  learning_rate: 1.0e-04  # 初始学习率降低，避免第一次PPO更新后策略参数变成NaN
  learning_rate_scheduler: null  # 固定学习率；KLAdaptiveLR 曾把 LR 拉到 1e-2，导致更新过激
  learning_rate_scheduler_kwargs: null
  state_preprocessor: RunningStandardScaler  # 状态预处理器，自动在训练中对状态观测值进行标准化(减去均值，除以标准差)
  state_preprocessor_kwargs: null  # 状态预处理器的额外参数
  value_preprocessor: RunningStandardScaler  # 价值预处理器，对价值网络的输出进行标准化，有助于稳定训练
  value_preprocessor_kwargs: null
  random_timesteps: 512  # 保留少量随机探索，但避免第一轮更新积累过多高方差随机轨迹
  learning_starts: 512  # 随机探索阶段结束后再开始更新
  grad_norm_clip: 1.0  # 梯度裁剪的最大范数，防止梯度爆炸
  ratio_clip: 0.2  # PPO的核心截断参数(epsilon)，限制新旧策略的比率在 [0.8, 1.2] 之间，防止单次更新步子迈太大
  value_clip: 0.2  # 对价值函数的更新进行裁剪的范围，防止价值评估突变
  clip_predicted_values: True  # 是否启用上述的价值网络裁剪
  entropy_loss_scale: 0.003  # 保留探索压力，但降低熵项对第一次更新的冲击
  value_loss_scale: 2.0  # 价值网络损失函数在总损失中的权重系数
  kl_threshold: 0.0  # 提前终止更新的KL散度阈值，0.0表示不使用固定阈值强制截断 epoch
  rewards_shaper_scale: 0.1  # 对环境返回的奖励进行缩放的系数（乘以0.1），避免奖励数值过大导致训练不稳定
  time_limit_bootstrap: False  # 是否对由于达到最大时间限制而结束的回合进行价值自举（这里不当作特殊回合处理）
  # logging and checkpoint
  experiment:
    directory: "cartpole_direct"  # 日志和模型保存的根文件夹名称（你可以把它改成如 "demo_learn_logs"）
    experiment_name: ""  # 具体的实验名称，如果不填会自动带上时间戳和算法名生成文件夹
    write_interval: auto  # Tensorboard日志写入的频率，auto表示根据算法自动决定（通常是每次更新后写一次）
    checkpoint_interval: auto  # 保存模型权重的频率，auto表示自动决定保存节奏


# Sequential trainer
# https://skrl.readthedocs.io/en/latest/api/trainers/sequential.html
trainer:
  class: SequentialTrainer  # 训练器类型，Sequential代表经典的按顺序执行：先在环境中收集数据，然后暂停仿真去更新模型网络
  timesteps: 100000  # 训练循环停止前，每个环境总共要走的步数（控制训练总时长）
  environment_info: log  # 将环境的信息（如Reward、Episode长度）输出到日志/控制台
